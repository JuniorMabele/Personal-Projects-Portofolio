<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbitBoard | Project Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><nav class="navbar px-4"><span class="navbar-brand fw-bold">OrbitBoard</span><span class="text-secondary small">PROJECT OPERATIONS</span></nav><main class="container-fluid p-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1">Product launch workspace</h1><p class="text-secondary mb-0">Turn plans into visible progress.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal">+ Add task</button></div><div class="row g-3 mb-4" id="metrics"></div><div class="row g-3" id="board"></div></main><div class="modal fade" id="taskModal"><div class="modal-dialog"><div class="modal-content"><form id="taskForm"><div class="modal-header"><h5 class="modal-title">Create project task</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Task name</label><input id="title" class="form-control mb-3" required><label class="form-label">Owner</label><input id="owner" class="form-control mb-3" placeholder="Alex Morgan" required><div class="row"><div class="col"><label class="form-label">Priority</label><select id="priority" class="form-select"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="col"><label class="form-label">Due date</label><input id="due" type="date" class="form-control"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Create task</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
