<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerGrid | Application Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><nav class="navbar px-4"><span class="navbar-brand fw-bold">CareerGrid</span><span class="text-secondary small">APPLICATION INTELLIGENCE</span></nav><main class="container-fluid p-4"><div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"><div><h1 class="h3 mb-1">Your opportunity pipeline</h1><p class="text-secondary mb-0">Make every application count.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#appModal">+ Track application</button></div><div id="metrics" class="row g-3 mb-4"></div><section class="card shadow-sm"><div class="card-body"><div class="row g-2 mb-3"><div class="col-md-6"><input id="search" class="form-control" placeholder="Search company, role or location"></div><div class="col-md-3"><select id="stageFilter" class="form-select"><option value="all">All stages</option><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div><div class="col-md-3"><select id="sort" class="form-select"><option value="recent">Recently added</option><option value="follow">Next follow-up</option></select></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Company / role</th><th>Location</th><th>Stage</th><th>Follow-up</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody id="appTable"></tbody></table></div></div></section></main><div class="modal fade" id="appModal"><div class="modal-dialog"><div class="modal-content"><form id="appForm"><div class="modal-header"><h5 class="modal-title">Track opportunity</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Company</label><input id="company" class="form-control mb-3" required><label class="form-label">Role</label><input id="role" class="form-control mb-3" required><div class="row"><div class="col"><label class="form-label">Location</label><input id="location" class="form-control mb-3" placeholder="Remote"></div><div class="col"><label class="form-label">Stage</label><select id="stage" class="form-select mb-3"><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div></div><div class="row"><div class="col"><label class="form-label">Follow-up date</label><input id="follow" type="date" class="form-control mb-3"></div><div class="col"><label class="form-label">Contact</label><input id="contact" class="form-control mb-3" placeholder="Recruiter name"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save application</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
