<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockPilot | Inventory Control</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><nav class="navbar navbar-dark px-4"><span class="navbar-brand fw-bold">StockPilot</span><span class="text-white-50 small">INVENTORY CONTROL</span></nav><main class="container-fluid p-4"><div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"><div><h1 class="h3 mb-1">Warehouse overview</h1><p class="text-secondary mb-0">Know what is available before customers ask.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">+ Add product</button></div><div id="metrics" class="row g-3 mb-4"></div><section class="card shadow-sm"><div class="card-body"><div class="row g-2 mb-3"><div class="col-md-6"><input id="search" class="form-control" placeholder="Search SKU, product or category"></div><div class="col-md-3"><select id="category" class="form-select"><option value="all">All categories</option></select></div><div class="col-md-3"><select id="stockFilter" class="form-select"><option value="all">All stock levels</option><option value="low">Low stock</option><option value="out">Out of stock</option></select></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>Category</th><th>Unit price</th><th>Available</th><th>Reorder level</th><th>Stock health</th><th>Actions</th></tr></thead><tbody id="productTable"></tbody></table></div></div></section></main><div class="modal fade" id="productModal"><div class="modal-dialog"><div class="modal-content"><form id="productForm"><div class="modal-header"><h5 class="modal-title">Add inventory item</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Product name</label><input id="name" class="form-control mb-3" required><label class="form-label">SKU</label><input id="sku" class="form-control mb-3" required><div class="row"><div class="col"><label class="form-label">Category</label><input id="cat" class="form-control mb-3" required></div><div class="col"><label class="form-label">Unit price</label><input id="price" type="number" min="0" step="0.01" class="form-control mb-3" required></div></div><div class="row"><div class="col"><label class="form-label">Opening stock</label><input id="quantity" type="number" min="0" class="form-control mb-3" required></div><div class="col"><label class="form-label">Reorder level</label><input id="reorder" type="number" min="0" class="form-control mb-3" value="10" required></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save product</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
