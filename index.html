<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeskFlow | Incident Command</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><nav class="navbar navbar-dark"><div class="container-fluid px-4"><span class="navbar-brand fw-bold">DeskFlow</span><span class="text-white-50 small">INCIDENT COMMAND CENTRE</span></div></nav><main class="container-fluid p-4"><div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"><div><h1 class="h3 mb-1">Incident command centre</h1><p class="text-secondary mb-0">Prioritise impact, protect SLAs, and restore service faster.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ticketModal">+ New incident</button></div><div id="metrics" class="row g-3 mb-4"></div><section class="card shadow-sm"><div class="card-body"><div class="row g-2 mb-3"><div class="col-lg-5"><input id="search" class="form-control" placeholder="Search incidents, people, departments"></div><div class="col-lg-2"><select id="statusFilter" class="form-select"><option value="all">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option></select></div><div class="col-lg-2"><select id="priorityFilter" class="form-select"><option value="all">All priorities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class="col-lg-3"><select id="sort" class="form-select"><option value="newest">Newest first</option><option value="priority">Highest priority</option></select></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Incident</th><th>Requester</th><th>Department</th><th>Priority</th><th>Owner</th><th>Status</th></tr></thead><tbody id="ticketTable"></tbody></table></div></div></section></main><div class="modal fade" id="ticketModal"><div class="modal-dialog"><div class="modal-content"><form id="ticketForm"><div class="modal-header"><h5 class="modal-title">Log support incident</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Issue title</label><input id="title" class="form-control mb-3" required><label class="form-label">Requester</label><input id="requester" class="form-control mb-3" required><label class="form-label">Department</label><input id="department" class="form-control mb-3" required><label class="form-label">Priority</label><select id="priority" class="form-select mb-3"><option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option></select><label class="form-label">Assign owner</label><select id="assignee" class="form-select"><option>Unassigned</option><option>Alex Morgan</option><option>Sam Williams</option><option>Jordan Lee</option></select></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Create incident</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
